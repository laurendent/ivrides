<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IV Rides Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#14213d;--mut:#6b7280;--ac:#0b5fff;--ac2:#e8f0ff;--gold:#f5a524;--ok:#12a150;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#181e27;--tx:#eef2f8;--mut:#9aa4b2;--ac:#5b92ff;--ac2:#1b2a47;--bd:#2a3340}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#181e27;--tx:#eef2f8;--mut:#9aa4b2;--ac:#5b92ff;--ac2:#1b2a47;--bd:#2a3340}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:410px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:600px){body{padding:20px 0}#app{width:410px;max-width:410px;height:820px;transform-origin:top center;transform:scale(var(--s,1));margin-bottom:calc(820px * (var(--s,1) - 1));border-radius:36px;border:8px solid #222;box-shadow:0 20px 60px #0004}}
#scr{flex:1;overflow-y:auto;padding:18px 16px 24px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0}
p{margin:0;color:var(--mut);font-size:14px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.btn{display:block;width:100%;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer;margin-top:12px}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.4}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:6px}
label{font-size:13px;font-weight:600;display:block;margin-top:12px}
.seg{display:flex;background:var(--ac2);border-radius:14px;padding 4px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--ac);font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.price{font-size:20px;font-weight:700;color:var(--ac)}
.tag{font-size:12px;background:var(--ac2);color:var(--ac);padding:3px 8px;border-radius:8px;font-weight:600}
.tag.g{background:#12a15022;color:var(--ok)}.tag.y{background:#f5a52433;color:#b36b00}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding:8px 0 10px}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.back{border:0;background:none;color:var(--ac);font-size:15px;padding:0 0 10px;cursor:pointer}
.big{text-align:center;padding:30px 0}.big .em{font-size:56px}
#scr.blue{display:flex;flex-direction:column;justify-content:center;padding-bottom:96px;background:linear-gradient(165deg,#8fd3ff 0%,#5aa2ff 55%,#7c9cff 100%);color:#fff}#scr.blue p,#scr.blue .note,#scr.blue label{color:#ffffffdd}#scr.blue .btn{background:#fff;color:#2f6fe0}#scr.blue input{border-color:transparent}
.sw{flex:none;width:48px;height:28px;border-radius:14px;border:0;background:var(--bd);position:relative;cursor:pointer}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on i{left:23px}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:5}
.seats{display:flex;gap:6px}.seat{width:18px;height:18px;border-radius:5px;background:var(--ac)}.seat.x{background:var(--bd)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body><div id="app"><div id="scr"></div><nav id="nav" style="display:none"></nav></div>
<script>
const DEST=["All","Trader Joe’s","Costco","Ralphs","State Street","SB Airport","Amtrak","Cottage Hospital","SBCC","LAX"];
let S={name:"Lauren Dent",year:"Freshman",phone:"",role:"Rider",view:"list",mt:null,wo:false,screen:"welcome",tab:"rides",mode:"find",filter:"All",sel:null,email:"",booked:[],posted:[],post:{kind:"drive",dest:"",women:false,day:"Sat",time:"2:00 PM",seats:3,price:4}};
let trips=[
{id:1,name:"Maya R.",sc:"UCSB",yr:"Junior",r:4.9,n:41,dest:"Costco",day:"Sat",time:"2:00 PM",seats:3,left:2,price:3,car:"Gray Honda Civic",pick:"The Loop bus stop"},
{id:2,name:"Jordan T.",sc:"SBCC",yr:"Sophomore",r:4.8,n:23,dest:"Trader Joe’s",day:"Fri",time:"5:30 PM",seats:3,left:3,price:2,car:"Blue Toyota RAV4",pick:"Embarcadero Hall"},
{id:3,name:"Priya S.",sc:"UCSB",yr:"Senior",r:5.0,n:67,dest:"SB Airport",day:"Sun",time:"6:15 AM",seats:3,left:1,price:6,car:"White Subaru Outback",pick:"Pardall & Embarcadero",women:true},
{id:4,name:"Ethan L.",sc:"UCSB",yr:"Grad",r:4.7,n:18,dest:"State Street",day:"Sat",time:"7:00 PM",seats:4,left:3,price:3,car:"Black Mazda 3",pick:"The Loop bus stop"},
{id:5,name:"Camila V.",sc:"UCSB",yr:"Junior",r:4.9,n:52,dest:"LAX",day:"Fri",time:"10:00 AM",seats:3,left:2,price:10,car:"Red Kia Soul",pick:"Embarcadero Hall",women:true},
{id:6,name:"Sam K.",sc:"SBCC",yr:"Sophomore",r:4.6,n:12,dest:"Cottage Hospital",day:"Mon",time:"8:15 AM",seats:2,left:1,price:4,car:"Silver Nissan Sentra",pick:"Pardall & Embarcadero"}];
let reqs=[
{name:"Lily C.",dest:"Ralphs",day:"Thu",time:"4–6 PM",riders:1,bag:"Groceries"},
{name:"Marcus B.",dest:"Amtrak",day:"Sat",time:"8–10 AM",riders:2,bag:"2 suitcases"},
{name:"Aisha N.",dest:"Costco",day:"Sun",time:"12–3 PM",riders:1,bag:"Groceries"},
{name:"Diego P.",dest:"LAX",day:"Fri",time:"9–11 AM",riders:1,bag:"1 suitcase"}];
const $=s=>document.querySelector(s);
const ic=(d,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">${d}</svg>`;
const I={car:s=>ic('<path d="M4 16v-4l2-5h12l2 5v4zM4 12h16M6 16v2M18 16v2"/>',s),plus:s=>ic('<path d="M12 5v14M5 12h14"/>',s),cal:s=>ic('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',s),user:s=>ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',s),pin:s=>ic('<path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',s),check:s=>ic('<path d="M5 12l4 4 10-10"/>',s),dollar:s=>ic('<path d="M12 3v18M16 7h-5a3 3 0 000 6h2a3 3 0 010 6H8"/>',s),chat:s=>ic('<path d="M4 5h16v11H9l-5 4z"/>',s)};
const go=(o)=>{Object.assign(S,o);render()};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;$("#app").appendChild(d);setTimeout(()=>d.remove(),2200)}
const ini=n=>n.split(" ").map(x=>x[0]).join("");
function render(){
const sc=$("#scr"),nav=$("#nav");const main=["rides","post","trips","profile"].includes(S.screen);
nav.style.display=main?"flex":"none";
if(main){nav.innerHTML=[["rides","car","Rides"],["post","plus","Post"],["trips","cal","My trips"],["profile","user","Profile"]].map(t=>`<button class="${S.screen==t[0]?"on":""}" onclick="go({screen:'${t[0]}'})"><span>${I[t[1]](22)}</span>${t[2]}</button>`).join("")}
sc.className=S.screen=="welcome"?"blue":"";sc.innerHTML=V[S.screen]();sc.scrollTop=0;
}
const V={
welcome:()=>`<div class="big" style="padding:0 0 20px"><div class="em" style="color:#fff">${I.car(56)}</div><h1>IV Rides</h1><p>Student carpools for Isla Vista &amp; Santa Barbara. Share a ride, split the cost.</p></div>
<p class="note" style="text-align:center;margin:0 0 6px">For verified UCSB &amp; SBCC students</p>
<label>School email</label><input id="em" type="email" placeholder="you@ucsb.edu or you@sbcc.edu" value="${S.email}">
<div class="note" id="err"></div>
<button class="btn" onclick="sendCode()">Send verification code</button>
<p class="note" style="text-align:center">Prototype: any @ucsb.edu or @sbcc.edu address works.</p>`,
code:()=>`<button class="back" onclick="go({screen:'welcome'})">‹ Back</button><h2>Check your email</h2><p>We sent a 6-digit code to ${S.email}.</p>
<label>Verification code</label><input id="cd" value="482915" inputmode="numeric" maxlength="6" style="letter-spacing:6px;text-align:center;font-size:22px">
<button class="btn" onclick="go({screen:'profsetup'})">Verify</button>`,
profsetup:()=>`<h2 style="color:var(--ok)">${I.check(22)} Email verified</h2><p>Set up your profile so others know who they’re riding with.</p>
<label>Name</label><input id="nm" value="${S.name}"><label>Class year</label><select id="yr">${["Freshman","Sophomore","Junior","Senior","Grad student"].map(y=>`<option ${y==S.year?"selected":""}>${y}</option>`).join("")}</select>
<label>Phone (for ride coordination)</label><input id="ph" placeholder="(805) 555-0123" value="${S.phone}">
<label>How will you use the app?</label>
<div class="seg" style="margin-top:6px">${["Rider","Driver","Both"].map(r=>`<button class="${S.role==r?"on":""}" onclick="pickRole(this,'${r}')">${r}</button>`).join("")}</div>
<p class="note">Drivers add license, car details and insurance later, before their first post.</p>
<button class="btn" onclick="go({screen:'rides',name:$('#nm').value.trim()||'Lauren Dent',year:$('#yr').value,phone:$('#ph').value.trim()})">Start riding</button>`,
rides:()=>{
const seg=`<div class="seg"><button class="${S.mode=="find"?"on":""}" onclick="go({mode:'find'})">Find a ride</button><button class="${S.mode=="offer"?"on":""}" onclick="go({mode:'offer'})">Offer a ride</button></div>`;
const chips=`<div class="chips"><button class="chip ${S.wo?"on":""}" onclick="go({wo:!S.wo})">Women-only</button>${DEST.map(d=>`<button class="chip ${S.filter==d?"on":""}" onclick="go({filter:'${d.replace("’","’")}'})">${d}</button>`).join("")}</div>`;
if(S.mode=="find"){const l=trips.filter(t=>(S.filter=="All"||t.dest==S.filter)&&(!S.wo||t.women));
return `<h1>Hi, ${S.name.split(" ")[0]}</h1><p style="margin-bottom:14px">Where to this week?</p>${seg}${chips}${viewToggle()}`+(S.view=="map"?mapView(l):l.length?l.map(t=>`<div class="card" onclick="go({screen:'detail',sel:${t.id}})" style="cursor:pointer"><div class="row sp"><div class="row"><div class="av">${ini(t.name)}</div><div><h3>${t.dest}</h3><p>${t.day} · ${t.time}${t.women?" · Women-only":""}</p></div></div><div class="price">$${t.price}</div></div>
<div class="row sp" style="margin-top:12px"><div class="row"><span class="tag">${t.sc}</span><span style="font-size:13px">★ ${t.r}</span><p>${t.name}</p></div><div class="seats">${Array.from({length:t.seats},(_,i)=>`<div class="seat ${i<t.seats-t.left?"x":""}"></div>`).join("")}</div></div></div>`).join(""):`<div class="card"><p>No trips to ${S.filter} yet. Post a request and drivers will see it.</p><button class="btn sec" onclick="go({screen:'post',post:{...S.post,kind:'request',dest:'${S.filter}'}})">Request a ride</button></div>`)}
return `<h1>Drivers wanted</h1><p style="margin-bottom:14px">Going somewhere anyway? Fill empty seats and cover gas.</p>${seg}
${reqs.filter(r=>S.filter=="All"||r.dest==S.filter).length?"":""}${chips}`+reqs.filter(r=>S.filter=="All"||r.dest==S.filter).map((r,i)=>`<div class="card"><div class="row sp"><div class="row"><div class="av">${ini(r.name)}</div><div><h3>${r.dest}</h3><p>${r.day} · ${r.time}</p></div></div><span class="tag y">${r.riders} rider${r.riders>1?"s":""}</span></div><p style="margin-top:8px">${r.name} · ${r.bag}</p><button class="btn sec" onclick="toast('Offer sent to ${r.name}')">Offer to drive</button></div>`).join("")+`<button class="btn" onclick="go({screen:'post',post:{...S.post,kind:'drive'}})">Post my own trip</button>`},
detail:()=>{const t=trips.find(x=>x.id==S.sel);return `<button class="back" onclick="go({screen:'rides'})">‹ Back</button>
<h2>${t.dest}</h2><p>${t.day} · ${t.time} · ${t.left} of ${t.seats} seats left${t.women?" · Women-only ride":""}</p>
<div class="card" style="margin-top:14px"><div class="row"><div class="av">${ini(t.name)}</div><div><h3>${t.name} <span class="tag g">✓ .edu verified</span></h3><p>${t.sc} · ${t.yr} · ★ ${t.r} (${t.n} rides)</p></div></div></div>
<div class="card"><h3>Pickup</h3><p>${I.pin(15)} ${t.pick}</p><h3 style="margin-top:12px">Car</h3><p>${I.car(15)} ${t.car} · plate verified</p><h3 style="margin-top:12px">Return</h3><p>Driver can bring you back around ${t.dest=="LAX"||t.dest=="SB Airport"?"on request":"90 minutes later"}</p></div>
<div class="card"><div class="row sp"><h3>Price per seat</h3><span class="price">$${t.price}</span></div><p class="note">Paid in app after the ride. Cancel free up to 2 hours before.</p></div>
<button class="btn" onclick="book(${t.id})" ${t.left<1||S.booked.includes(t.id)?"disabled":""}>${S.booked.includes(t.id)?"Already claimed":"Claim a seat"}</button>`},
confirm:()=>{const t=trips.find(x=>x.id==S.sel);return `<div class="big"><div class="em" style="color:var(--ok)">${I.check(56)}</div><h1>Seat claimed!</h1><p>${t.dest} · ${t.day} ${t.time}</p></div>
<div class="card"><p>${I.pin(15)} Meet at <b style="color:var(--tx)">${t.pick}</b> 5 min early</p><p style="margin-top:6px">${I.car(15)} ${t.car} with ${t.name}</p><p style="margin-top:6px">${I.dollar(15)} $${t.price} charged after the ride</p></div>
<button class="btn" onclick="toast('Chat opened (mock)')">${I.chat(16)} Message ${t.name.split(" ")[0]}</button>
<button class="btn sec" onclick="toast('Trip link copied')">Share trip with a friend</button>
<button class="btn sec" onclick="go({screen:'trips'})">View my trips</button>`},
post:()=>{const p=S.post;const dr=p.kind=="drive";return `<h2>Post</h2><div class="seg"><button class="${dr?"on":""}" onclick="up('kind','drive')">I’m driving</button><button class="${!dr?"on":""}" onclick="up('kind','request')">I need a ride</button></div>
<label>Destination</label><input list="dl" placeholder="Type any place or pick one" value="${p.dest}" oninput="S.post.dest=this.value"><datalist id="dl">${DEST.slice(1).map(d=>`<option value="${d}">`).join("")}</datalist>
<div class="row"><div style="flex:1"><label>Day</label><select onchange="S.post.day=this.value">${["Fri","Sat","Sun","Mon","Tue","Wed","Thu"].map(d=>`<option ${d==p.day?"selected":""}>${d}</option>`).join("")}</select></div>
<div style="flex:1"><label>${dr?"Time":"Time window"}</label><select onchange="S.post.time=this.value">${["8:00 AM","12:00 PM","2:00 PM","5:00 PM","Flexible"].map(d=>`<option ${d==p.time?"selected":""}>${d}</option>`).join("")}</select></div></div>
<label>${dr?"Open seats":"Riders in your group"}: <span id="sv">${p.seats}</span></label><input type="range" min="1" max="4" value="${p.seats}" oninput="S.post.seats=+this.value;$('#sv').textContent=this.value">
${dr?`<label>Price per seat (max $10): <span id="pv" class="price" style="font-size:16px">$${p.price}</span></label><input type="range" min="1" max="10" value="${p.price}" oninput="S.post.price=+this.value;$('#pv').textContent='$'+this.value"><p class="note">Suggested for this trip: $3–$5. Max $10 per seat.</p>
<p class="note">Est. earnings if full: <b id="ern">$${p.price*p.seats}</b></p>`:`<p class="note">Drivers heading your way will see your request and can offer to take you.</p>`}
<div class="card row sp" style="margin:16px 0 0"><div><h3>Women-only</h3><p>${dr?"Only women can claim seats":"Match me with women drivers only"}</p></div><button class="sw ${p.women?"on":""}" onclick="S.post.women=!S.post.women;this.classList.toggle('on')"><i></i></button></div>
<button class="btn" onclick="submitPost()">${dr?"Post trip":"Post request"}</button>`},
trips:()=>{const all=S.booked.map(id=>trips.find(t=>t.id==id));return `<h2>My trips</h2>`+(all.length||S.posted.length?all.map(t=>`<div class="card"><div class="row sp"><h3>${t.dest}</h3><span class="tag g">Booked</span></div><p>${t.day} · ${t.time} · ${t.name}</p><p class="note">${I.pin(13)} ${t.pick}</p></div>`).join("")+S.posted.map(t=>`<div class="card"><div class="row sp"><h3>${t.dest}</h3><span class="tag ${t.kind=="drive"?"":"y"}">${t.kind=="drive"?"You’re driving":"Requested"}</span></div><p>${t.day} · ${t.time} · ${t.seats} ${t.kind=="drive"?"seats @ $"+t.price:"rider(s)"}${t.women?" · Women-only":""}</p></div>`).join(""):`<div class="card"><p>No upcoming trips yet. Find a ride or post one.</p></div>`)+`<h3 style="margin:16px 0 8px">Past</h3><div class="card"><div class="row sp"><h3>Trader Joe’s</h3><span>★ 5</span></div><p>Last Sun · with Dani M. · $2</p></div>`},
profile:()=>`<div class="big" style="padding:10px 0 20px"><div class="av" style="width:80px;height:80px;font-size:28px;margin:0 auto 10px">${ini(S.name)}</div><h2 style="margin:0">${S.name}</h2><p>${/sbcc/.test(S.email)?"SBCC":"UCSB"} · ${S.year}</p><span class="tag g" style="margin-top:8px;display:inline-block">✓ ${S.email||"you@ucsb.edu"}</span></div>
<div class="row" style="margin-bottom:12px"><div class="card" style="flex:1;text-align:center;margin:0"><h2 style="margin:0">4.9</h2><p>Rating</p></div><div class="card" style="flex:1;text-align:center;margin:0"><h2 style="margin:0">14</h2><p>Rides</p></div><div class="card" style="flex:1;text-align:center;margin:0"><h2 style="margin:0">$${38+S.posted.filter(p=>p.kind=="drive").reduce((a,p)=>a+p.price*p.seats,0)}</h2><p>Earned</p></div></div>
<div class="card"><h3>Account</h3><p style="margin-top:6px">Role: ${S.role}<br>Phone: ${S.phone||"Not added"}</p></div>
<div class="card"><h3>Driver status</h3><p style="margin-top:6px">${S.role=="Rider"?"Rider account. Add a car to start offering rides.":"Add license, insurance and car details before your first trip."}</p></div>
<div class="card"><h3>Safety</h3><p style="margin-top:6px">Trusted contacts · Report or block · SOS button on trip day</p></div>
<div class="card"><h3>Preferences</h3><p style="margin-top:6px">Women-only rides: off<br>Quarter verification renews Jan 2027</p></div>
<button class="btn sec" onclick="go({screen:'welcome',booked:[],posted:[]})">Sign out</button>`
};
const P={"Costco":[135,118],"Trader Joe’s":[165,142],"Ralphs":[190,112],"SB Airport":[108,158],"Cottage Hospital":[270,178],"SBCC":[228,196],"State Street":[300,190],"Amtrak":[322,208],"LAX":[330,268]};
function viewToggle(){return `<div class="seg" style="margin-bottom:12px"><button class="${S.view!="map"?"on":""}" onclick="go({view:'list'})">List</button><button class="${S.view=="map"?"on":""}" onclick="go({view:'map'})">Map</button></div>`}
function mapView(l){const sel=l.find(t=>t.id==S.mt)||l[0];const used=new Set(l.map(t=>t.dest));
let s=`<svg viewBox="0 0 360 300" style="width:100%;display:block;border-radius:16px;border:1px solid var(--bd);background:var(--card)"><path d="M0 195Q90 205 150 198T300 226L360 238V300H0Z" style="fill:var(--ac2)"/><text x="20" y="270" style="font-size:10px;fill:var(--mut);font-style:italic">Pacific Ocean</text>`;
Object.entries(P).forEach(([n,p])=>{const u=used.has(n);s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${u?5:3}" style="fill:${u?"var(--ac)":"var(--mut)"}"/><text x="${p[0]}" y="${p[1]+(n=="LAX"?-9:15)}" text-anchor="middle" style="font-size:8.5px;fill:var(--tx)">${n}</text>`});
l.forEach(t=>{const d=P[t.dest];if(!d)return;const on=sel&&sel.id==t.id;s+=`<line x1="48" y1="172" x2="${d[0]}" y2="${d[1]}" stroke-dasharray="4 3" style="stroke:var(--ac);stroke-width:${on?2.5:1.2};opacity:${on?1:.35}"/>`});
s+=`<circle cx="48" cy="172" r="9" style="fill:var(--gold)"/><text x="48" y="191" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--tx)">UCSB / IV</text>`;
l.forEach(t=>{const d=P[t.dest];if(!d)return;const k=l.filter(x=>x.dest==t.dest).indexOf(t),f=.4+.2*k,x=48+f*(d[0]-48),y=172+f*(d[1]-172),on=sel&&sel.id==t.id;s+=`<g onclick="go({mt:${t.id}})" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?13:11}" style="fill:var(--ac);stroke:${on?"#f5a524":"#fff"};stroke-width:2.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#fff">${ini(t.name)}</text></g>`});
s+=`</svg><p class="note" style="margin:8px 0 12px">Tap a driver to see where they’re headed. Routes start at UCSB / Isla Vista. Schematic map, not to scale.</p>`;
s+=sel?`<div class="card"><div class="row sp"><div class="row"><div class="av">${ini(sel.name)}</div><div><h3>${sel.name} → ${sel.dest}</h3><p>${sel.day} · ${sel.time}${sel.women?" · Women-only":""}</p></div></div><div class="price">$${sel.price}</div></div><p style="margin-top:8px">${sel.left} of ${sel.seats} seats left · Pickup: ${sel.pick}</p><button class="btn" onclick="go({screen:'detail',sel:${sel.id}})">View trip</button></div>`:`<div class="card"><p>No drivers match this filter yet.</p></div>`;
return s}
function pickRole(b,r){S.role=r;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function up(k,v){S.post[k]=v;render()}
function sendCode(){const e=$("#em").value.trim().toLowerCase();if(!/^[^@\s]+@(ucsb|sbcc)\.edu$/.test(e)){$("#err").textContent="Please use your @ucsb.edu or @sbcc.edu email.";$("#err").style.color="#fff";return}S.email=e;go({screen:"code"})}
function book(id){const t=trips.find(x=>x.id==id);t.left--;S.booked.push(id);go({screen:"confirm"})}
function submitPost(){if(!S.post.dest.trim()){toast("Enter a destination");return}S.posted.push({...S.post});S.post={...S.post,dest:"",women:false};toast(S.post.kind=="drive"?"Trip posted!":"Request posted!");go({screen:"trips"})}
function fit(){document.documentElement.style.setProperty('--s',Math.min(1,(innerHeight-40)/820))}fit();addEventListener("resize",fit);
document.addEventListener("input",e=>{if(S.screen=="post"&&$("#ern"))$("#ern").textContent="$"+S.post.price*S.post.seats});
render();
</script></body></html>
